<!doctype html>
<!--
  Source for the Devpost gallery images in this directory (3:2, 1500x1000).
  Open at 1500x1000 and capture #card at device scale 1:
    frame.html?cover            the cover card (Devpost uses the first image as the thumbnail)
    frame.html?img=raw/x.png&title=...&sub=...   a captioned simulator screenshot
  Screenshots in raw/ are real captures of the simulator against the deployed server.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>HomeLedger gallery frame</title>
<style>
  :root { --ink: #13212e; --muted: #51606f; --paper: #f6f1e7; --accent: #f2a23a; --bg: #eef1f4; }
  html, body { margin: 0; }
  #card {
    width: 1500px; height: 1000px; box-sizing: border-box; background: var(--bg);
    font-family: "Inter", "Helvetica Neue", Arial, sans-serif; color: var(--ink);
    display: flex; flex-direction: column; overflow: hidden;
  }
  header { display: flex; align-items: center; gap: 20px; padding: 36px 56px 22px; }
  header img { width: 56px; height: 56px; }
  header h1 { margin: 0; font-size: 38px; font-weight: 700; letter-spacing: -0.3px; }
  header p { margin: 4px 0 0; font-size: 22px; color: var(--muted); }
  .shot { flex: 1; display: flex; align-items: center; justify-content: center; padding: 0 56px 44px; min-height: 0; }
  .shot img { max-width: 100%; max-height: 100%; border-radius: 14px; box-shadow: 0 18px 50px rgba(19, 33, 46, 0.25); }

  #card.cover { background: var(--ink); color: var(--paper); justify-content: center; padding: 0 110px; }
  .cover .row { display: flex; align-items: center; gap: 56px; }
  .cover .row img { width: 260px; height: 260px; }
  .cover h1 { font-size: 112px; margin: 0; letter-spacing: -2px; }
  .cover .tag { font-size: 38px; line-height: 1.3; margin-top: 18px; color: #dfe6ec; max-width: 1000px; }
  .cover .stack { margin-top: 70px; font-size: 26px; color: var(--accent); letter-spacing: 0.4px; }
  .cover .note { margin-top: 14px; font-size: 22px; color: #9fb0bf; }
</style>
</head>
<body>
<div id="card"></div>
<script>
  const q = new URLSearchParams(location.search);
  const card = document.getElementById('card');
  const esc = s => s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
  if (q.has('cover')) {
    card.className = 'cover';
    card.innerHTML = `
      <div class="row">
        <img src="icon.svg" alt="">
        <div>
          <h1>HomeLedger</h1>
          <div class="tag">Your home's operating record, for an Alexa+ assistant — fed by a real Ring doorbell and flood sensor.</div>
        </div>
      </div>
      <div class="stack">MCP server on Bedrock AgentCore · Ring Partner API · Lambda · EventBridge · DynamoDB</div>
      <div class="note">Open source, MIT · github.com/jkarns87/homeledger</div>`;
  } else {
    card.innerHTML = `
      <header>
        <img src="icon.svg" alt="">
        <div><h1>${esc(q.get('title') || '')}</h1><p>${esc(q.get('sub') || '')}</p></div>
      </header>
      <div class="shot"><img src="${esc(q.get('img') || '')}" alt=""></div>`;
  }
  const imgs = [...card.querySelectorAll('img')];
  Promise.all(imgs.map(i => i.complete ? 1 : new Promise(r => { i.onload = r; i.onerror = r; }))).then(() => { document.title = 'ready'; });
</script>
</body>
</html>
