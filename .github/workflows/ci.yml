name: ci
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    services:
      dynamodb:
        image: amazon/dynamodb-local:latest
        ports: ['8000:8000']
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10.15.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      # @homeledger/core is consumed by @homeledger/mcp-server via its published
      # dist/ entry point (package.json main/types), not TS source directly, so
      # a fresh checkout must build it before typecheck/test of mcp-server can
      # resolve the module.
      - run: pnpm --filter @homeledger/core build
      # Same reasoning, one package along. @homeledger/simulator consumes
      # @homeledger/mcp-bridge through the subpath `exports` map added in Plan 3
      # Task 2, and every entry in it points at `./dist/*`, which is gitignored.
      # Without this line a clean checkout fails `pnpm typecheck` with seven
      # TS2307s and `pnpm test` with "Cannot find package
      # '@homeledger/mcp-bridge/config'" — verified by moving `dist/` aside.
      - run: pnpm --filter @homeledger/mcp-bridge build
      - run: pnpm format
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm --filter @homeledger/core test:dynamo
      - run: pnpm build

  # Plan 3 Task 15's browser run, wired in because the plan that added it never
  # wires Playwright into CI on its own — without this job the suite is
  # decorative, run by hand and easy to let drift. It is safe to add here and
  # `test` above is not: the local MCP server this suite starts sets
  # `MEMORY_REPO=1` (`apps/mcp-server/src/deps.ts`), which is a plain in-memory
  # `Repository` with no DynamoDB and no AWS SDK call anywhere in its path — the
  # opposite of `test`'s own `dynamodb` service container, which exists only
  # because `pnpm test:dynamo` talks to a real (local) DynamoDB. Nothing here
  # needs a credential, a service container, or network access beyond
  # 127.0.0.1. `HOMELEDGER_SIMULATOR_SCRIPTED_MODEL=1` (playwright.config.ts's
  # own webServer env) is what keeps it that way on the simulator's side: the
  # scripted model in `src/server/scripted-model.ts` never constructs an
  # Anthropic client, so `ANTHROPIC_API_KEY` is a placeholder string, never a
  # real key, and no live Anthropic call is possible from this job either.
  #
  # A separate job, not a step folded into `test`: `test` is the required
  # check on every pull request and `pnpm build`/`pnpm test` there are already
  # the fast path; two dev servers plus a Chromium download adds a minute or
  # more that a merge should not have to wait on for a check nobody there
  # requires. Named `e2e`, distinct from the three checks `main` requires
  # today (`test`, `terraform`, `image`) — making it required is a repository
  # setting, and is Joey's call, not this workflow's.
  e2e:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10.15.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      # Same two builds `test` above needs and for the same reason: the
      # simulator's dev server imports @homeledger/core and @homeledger/mcp-bridge
      # through their built dist/, and playwright.config.ts's webServer entries
      # boot both apps from a clean checkout with no prior `pnpm build`.
      - run: pnpm --filter @homeledger/core build
      - run: pnpm --filter @homeledger/mcp-bridge build
      - run: pnpm --filter @homeledger/simulator exec playwright install --with-deps chromium
      - run: pnpm --filter @homeledger/simulator run test:e2e

  # The gap FL-036 records: `test` above installs the whole workspace, while the
  # image copies only `packages/core` and `apps/mcp-server` into its build
  # context — so the two disagree about what the workspace contains, and `test`
  # is green for workspace edges the image cannot resolve. Three merges passed
  # `test` and failed the deploy's own "Build and push image" step before anyone
  # noticed. This job builds the same Dockerfile the deploy builds, so that
  # disagreement fails the pull request instead of the merge.
  #
  # Build only. It never pushes, never applies, and deliberately holds no AWS
  # credentials: it needs none, and a pull_request-triggered job is the wrong
  # place to hand them out. The workflow-level `permissions: contents: read`
  # covers it; there is no `id-token: write` here.
  image:
    # Only on pull requests. A push to main already builds this image in
    # deploy.yml's `apply` job, which cannot apply anything without it, so
    # repeating the build here would buy nothing.
    if: github.event_name == 'pull_request'
    # Native arm64, not QEMU. The Dockerfile pins `--platform=linux/arm64`
    # (AgentCore runs arm64), so on an x86 runner every RUN layer — `pnpm
    # install`, two `tsc` invocations, `pnpm deploy` — would be emulated, which
    # costs minutes per pull request for no extra coverage: the errors this
    # catches are workspace-graph and build-context errors, which are identical
    # on either architecture, and nothing the server depends on ships a native
    # addon. `ubuntu-24.04-arm` is free on public repositories and runs the
    # exact platform production runs, so it is both the cheap answer and the
    # faithful one.
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build the mcp-server image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/mcp-server/Dockerfile
          push: false
          # Layer cache, so the expensive early layers (base image, `pnpm
          # install`) are only paid for when the lockfile or a package.json
          # actually changes. `ignore-error` because this job exists to catch a
          # broken image, and a hiccup in the Actions cache service must never
          # be what fails a pull request.
          cache-from: type=gha
          cache-to: type=gha,mode=max,ignore-error=true

  terraform:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with: { terraform_version: '1.16.1' }

      - name: terraform fmt
        working-directory: infra
        run: terraform fmt -check -recursive

      - name: platform validate and test
        working-directory: infra/live/demo/platform
        run: |
          terraform init -backend=false
          terraform validate
          terraform test

      - name: agentcore-runtime validate and test
        working-directory: infra/modules/agentcore-runtime
        run: |
          terraform init -backend=false
          terraform validate
          terraform test

      - name: cognito-m2m validate and test
        working-directory: infra/modules/cognito-m2m
        run: |
          terraform init -backend=false
          terraform validate
          terraform test

      - name: knowledge-base validate and test
        working-directory: infra/modules/knowledge-base
        run: |
          terraform init -backend=false
          terraform validate
          terraform test

      - uses: terraform-linters/setup-tflint@v4

      - name: tflint init
        working-directory: infra
        run: tflint --init

      - name: tflint
        working-directory: infra
        run: tflint --recursive --config "$(pwd)/.tflint.hcl"

      # Scanned per directory, not as a single `scan-ref: infra`: trivy's
      # Terraform-aware scan of the infra tree (or of infra/live/demo/platform
      # alone) follows the cognito-m2m module reference but not the
      # agentcore-runtime one, so the execution role's inline IAM policy is
      # silently never evaluated by a tree-wide scan. Each reusable module
      # scanned as its own root, on the other hand, is evaluated correctly
      # (confirmed locally: `trivy config --severity LOW,MEDIUM,HIGH,CRITICAL
      # infra/modules/agentcore-runtime` reports Target "." scanned, 0
      # misconfigurations - a real evaluated result, not a skip).
      - name: trivy (platform)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: infra/live/demo/platform
          severity: HIGH,CRITICAL
          exit-code: '1'

      - name: trivy (agentcore-runtime)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: infra/modules/agentcore-runtime
          severity: HIGH,CRITICAL
          exit-code: '1'

      - name: trivy (cognito-m2m)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: infra/modules/cognito-m2m
          severity: HIGH,CRITICAL
          exit-code: '1'

      - name: trivy (knowledge-base)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: infra/modules/knowledge-base
          severity: HIGH,CRITICAL
          exit-code: '1'
