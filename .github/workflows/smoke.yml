name: smoke
on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-24.04
    environment: demo
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      HOUSEHOLD_ID: hh_harlow
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with: { terraform_version: '1.16.1', terraform_wrapper: false }

      - name: Terraform init
        working-directory: infra/live/demo/platform
        run: terraform init -backend-config="bucket=$TF_STATE_BUCKET" -backend-config="region=$AWS_REGION"

      - name: Export Terraform outputs
        id: tf-outputs
        working-directory: infra/live/demo/platform
        run: |
          MCP_URL=$(terraform output -raw agent_runtime_invocation_url)
          COGNITO_TOKEN_URL=$(terraform output -raw cognito_token_url)
          COGNITO_CLIENT_ID=$(terraform output -raw cognito_client_id)
          COGNITO_CLIENT_SECRET=$(terraform output -raw cognito_client_secret)
          TABLE_NAME=$(terraform output -raw table_name)
          # The three knowledge-base module outputs are read tolerantly, and
          # only these three. They are populated today - the Knowledge Base
          # module applied cleanly on the first post-merge deploy, so the
          # bucket, the Knowledge Base, and its IAM role all exist (FL-032
          # corrects the earlier assumption, repeated in this comment, that
          # the apply itself was blocked). The tolerance is kept anyway,
          # because a `terraform destroy` of just this module, or a rollback
          # to a state before it, puts them back to exiting 1 - which under
          # this step's `set -e` would fail the workflow here, before the
          # smoke runs at all, for a reason that has nothing to do with what
          # the smoke exists to check. Empty is a meaningful value
          # downstream: it is exactly what scripts/smoke.ts's
          # checkManualPassages reads as "no Knowledge Base provisioned".
          # Everything above stays strict, because a missing runtime URL or
          # table name IS a broken deploy.
          MANUALS_BUCKET=$(terraform output -raw manuals_bucket 2>/dev/null || true)
          KNOWLEDGE_BASE_ID=$(terraform output -raw knowledge_base_id 2>/dev/null || true)
          DATA_SOURCE_ID=$(terraform output -raw data_source_id 2>/dev/null || true)
          AGENT_RUNTIME_ARN=$(terraform output -raw agent_runtime_arn)
          echo "::add-mask::$COGNITO_CLIENT_SECRET"
          {
            echo "MCP_URL=$MCP_URL"
            echo "COGNITO_TOKEN_URL=$COGNITO_TOKEN_URL"
            echo "COGNITO_CLIENT_ID=$COGNITO_CLIENT_ID"
            echo "TABLE_NAME=$TABLE_NAME"
            echo "MANUALS_BUCKET=$MANUALS_BUCKET"
            echo "KNOWLEDGE_BASE_ID=$KNOWLEDGE_BASE_ID"
            echo "DATA_SOURCE_ID=$DATA_SOURCE_ID"
            echo "AGENT_RUNTIME_ARN=$AGENT_RUNTIME_ARN"
          } >> "$GITHUB_ENV"
          # Kept out of $GITHUB_ENV so it never reaches later steps' full
          # environment (pnpm install included) - only the "Run smoke" step
          # below receives it, via its own env:.
          echo "client_secret=$COGNITO_CLIENT_SECRET" >> "$GITHUB_OUTPUT"

      - uses: pnpm/action-setup@v4
        with: { version: 10.15.0 }

      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter @homeledger/core build

      - run: pnpm --filter @homeledger/scripts seed:remote

      # seed:manual uploads the document scripts/smoke.ts's manual assertion
      # looks for, and it requires KNOWLEDGE_BASE_ID and DATA_SOURCE_ID to
      # start an ingestion job. With no Knowledge Base provisioned there is
      # nothing to ingest into, so the step is skipped rather than left to
      # die on `KNOWLEDGE_BASE_ID is required` - the same condition, and the
      # same reasoning, as the smoke's own ask_manual skip. The companion
      # step below makes the skip visible in the log instead of silent.
      #
      # When a Knowledge Base DOES exist the step runs and must still be able
      # to fail the job: a malformed metadata sidecar, an S3 key outside the
      # data source's prefix, a dataSourceId that does not belong to the
      # knowledge base, an unrelated IAM denial, and a job that starts and
      # then reports FAILED all exit non-zero from seed:manual and fail here.
      # Deliberately NOT `continue-on-error: true`, which would swallow every
      # one of those alongside the one condition we mean to tolerate.
      #
      # The single tolerated condition is the account-wide Bedrock model
      # block (FL-019, FL-032): seed:manual identifies it positively, prints
      # its skip banner plus the bare MANUAL_INGESTION_SKIPPED sentinel, and
      # exits 0. The grep below turns that sentinel into an environment
      # variable for the smoke step, which is the only way smoke.ts can tell
      # "the Knowledge Base is empty because ingestion was skipped" (skip)
      # from "the Knowledge Base returned the wrong document" (fail hard) -
      # the two are identical from the retrieval side.
      #
      # Same log-sentinel idiom as the `grep -q '^SMOKE OK$'` gate below, and
      # it fails in the same safe direction: if the sentinel is ever not
      # matched, MANUAL_INGESTION_SKIPPED stays unset, the smoke enforces the
      # assertion, and the run goes red. A missed skip costs a red pipeline a
      # human reads; a spurious skip would cost a green one nobody questions.
      - name: Seed the smoke manual
        if: env.KNOWLEDGE_BASE_ID != ''
        run: |
          pnpm --filter @homeledger/scripts seed:manual | tee seed-manual.log
          if grep -q '^MANUAL_INGESTION_SKIPPED$' seed-manual.log; then
            echo "MANUAL_INGESTION_SKIPPED=1" >> "$GITHUB_ENV"
          fi

      - name: Skip manual seeding (no Knowledge Base)
        if: env.KNOWLEDGE_BASE_ID == ''
        run: 'echo "seed:manual: SKIPPED - no KNOWLEDGE_BASE_ID configured, so no Knowledge Base is provisioned (FRICTION-LOG.md FL-019)"'

      - name: Run smoke
        env:
          COGNITO_CLIENT_SECRET: ${{ steps.tf-outputs.outputs.client_secret }}
        # KNOWLEDGE_BASE_ID and MANUAL_INGESTION_SKIPPED are not listed here
        # and must not be: both arrive through $GITHUB_ENV (the first from
        # the Terraform outputs step, the second from the seed step's
        # sentinel grep), which already puts them in this step's environment.
        # Re-declaring MANUAL_INGESTION_SKIPPED as `${{ env.… }}` would only
        # add a way for the two to disagree.
        #
        # The trailing grep is not redundant with pnpm smoke's own exit code
        # (task-13-review.md Finding 2, IMPORTANT): a symlinked workspace can
        # make smoke.ts's entrypoint guard skip the entire script - no
        # assertions run, nothing printed, process exits 0 anyway. Requiring
        # the sentinel the script only ever prints as its last line means
        # this step cannot pass without the script actually having reached
        # its end, independent of and in addition to the realpath fix in
        # smoke.ts itself.
        run: pnpm smoke | tee smoke.log && grep -q '^SMOKE OK$' smoke.log

      - name: Tail runtime logs
        if: always()
        continue-on-error: true
        run: |
          RUNTIME_ID="${AGENT_RUNTIME_ARN##*/}"
          aws logs tail "/aws/bedrock-agentcore/runtimes/${RUNTIME_ID}-DEFAULT" --since 30m --format short
