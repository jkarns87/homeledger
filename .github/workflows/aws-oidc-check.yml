name: aws-oidc-check

# Proves the GitHub -> AWS OIDC trust works: assumes the deploy role and prints the identity.
# Runs on demand, and once when this file itself changes on main.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/aws-oidc-check.yml']

permissions:
  id-token: write
  contents: read

jobs:
  whoami:
    runs-on: ubuntu-latest
    steps:
      - name: Assume the deploy role via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}
      - name: Who am I
        run: aws sts get-caller-identity
      - name: State bucket is reachable
        env:
          TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
        run: aws s3api head-bucket --bucket "$TF_STATE_BUCKET"

      # Informational: can the deploy role reach Bedrock and AgentCore right now?
      # Never fails the job; read the step log.
      - name: Bedrock and AgentCore reachable from the deploy role
        continue-on-error: true
        run: |
          for M in us.amazon.nova-lite-v1:0 us.anthropic.claude-sonnet-4-6; do
            echo "== converse $M"
            aws bedrock-runtime converse --model-id "$M" \
              --messages '[{"role":"user","content":[{"text":"Reply with the single word: ready"}]}]' \
              --inference-config '{"maxTokens":5}' \
              --query 'output.message.content[0].text' --output text || echo "FAILED: $M"
          done
          echo "== agentcore control plane"
          aws bedrock-agentcore-control list-agent-runtimes \
            --query 'agentRuntimes[].[agentRuntimeName,status]' --output text || echo "FAILED: list-agent-runtimes"
